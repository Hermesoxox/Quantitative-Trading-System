name: Real-Data Backtest

# GitHub 托管 runner 出网不受本地沙箱网络策略限制，可直连东方财富接口，
# 因此能在 CI 里跑真实A股数据回测，并把绩效文本与图表作为产物上传。

on:
  workflow_dispatch:        # 手动触发，可填参数
    inputs:
      n_stocks:
        description: "股票数量(沪深300前N只，控制时长)"
        required: false
        default: "60"
      start:
        description: "起始日期 YYYY-MM-DD"
        required: false
        default: "2016-01-01"
      end:
        description: "结束日期 YYYY-MM-DD"
        required: false
        default: "2025-12-31"
  schedule:
    - cron: "0 20 * * 0"    # 每周日 20:00 UTC 定期跑一次，监控策略衰减

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke tests
        run: python tests/test_smoke.py

      - name: Run real-data backtest
        env:
          N_STOCKS: ${{ github.event.inputs.n_stocks || '60' }}
          START: ${{ github.event.inputs.start || '2016-01-01' }}
          END: ${{ github.event.inputs.end || '2025-12-31' }}
        run: |
          set -o pipefail
          mkdir -p reports
          python -u -m examples.run_real_backtest \
            --n "$N_STOCKS" --start "$START" --end "$END" \
            2>&1 | tee reports/backtest_log.txt

      - name: Upload performance report (plots + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: |
            reports/*.png
            reports/backtest_log.txt
          if-no-files-found: warn
          retention-days: 30

  advanced-backtest:
    # 进阶版：真实数据 + 集中持仓(≤5) + GBDT + 市场状态/波动率目标 + 回撤守卫
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run advanced real-data backtest
        env:
          N_STOCKS: ${{ github.event.inputs.n_stocks || '60' }}
          START: ${{ github.event.inputs.start || '2016-01-01' }}
          END: ${{ github.event.inputs.end || '2025-12-31' }}
        run: |
          set -o pipefail
          mkdir -p reports_advanced
          python -u -m examples.run_advanced --real \
            --n "$N_STOCKS" --start "$START" --end "$END" \
            2>&1 | tee reports_advanced/advanced_log.txt
      - name: Upload advanced report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-backtest-report
          path: |
            reports_advanced/*.png
            reports_advanced/advanced_log.txt
          if-no-files-found: warn
          retention-days: 30
