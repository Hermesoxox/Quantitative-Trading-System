name: CI

# 无网络依赖的持续验证：冒烟测试 + 合成数据端到端回测(含绘图)。
# 保证核心逻辑(交易规则/因子/信号/引擎/绘图)在每次推送后仍可跑通。

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (无需 akshare，合成数据 + 绘图)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy statsmodels matplotlib tqdm requests
      - name: Smoke tests
        run: python tests/test_smoke.py
      - name: Synthetic end-to-end backtest
        run: python -m examples.run_backtest
      - name: Upload synthetic plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report
          path: reports/*.png
          if-no-files-found: warn
